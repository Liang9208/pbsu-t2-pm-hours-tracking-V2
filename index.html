<body>
<main class="shell">
  <header class="topbar"><div class="brand"><div class="mark">OT</div><div><h1>Roster OT 对比分析器</h1><p>6日 cycle 与 Mon–Sun 周分开分析</p></div></div><div class="privacy">仅在浏览器本地处理文件</div></header>
  <section class="upload"><div><h2>上传 roster workbook</h2><p>自动寻找 “OT TRACKING”，读取两张表、公式与黄色填色。支持当前工作簿的单 sheet 结构。</p></div><label class="drop" id="drop"><strong>选择或拖入 .xlsx 文件</strong><span id="fileName">文件不会上传到网络</span><input id="file" type="file" accept=".xlsx"></label></section>
  <div id="status" class="status"></div>
  <section id="results" class="results">
    <div id="summary" class="summary"></div>
    <nav class="tabs" aria-label="分析视图">
      <button class="tab active" data-tab="exceptions">Exceptions</button><button class="tab" data-tab="method">Rules & methodology</button>
    </nav>
    <div id="exceptions" class="panel active"><div id="officer"></div><div id="compare"></div><div id="cap"></div><div id="identity"></div><div id="pattern"></div><div id="weeks"></div></div><div id="method" class="panel"><div id="rules"></div><div id="formula"></div></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={buffer:null,book:null,report:null,diffTeam:'B1',rules:{aWork:12,aYellow:11,a2200:null,a2200Yellow:null,aNS:8,bWork:12,bYellow:11,b2200:null,b2200Yellow:null,firstOT2:4,firstOT2Yellow:3,otherOT2:12,otherOT2Yellow:11}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round1=n=>Math.round((n+Number.EPSILON)*10)/10;
function setStatus(t,bad=false){$('#status').textContent=t;$('#status').className='status'+(bad?' error':'')}

/* Minimal XLSX reader: central directory + browser-native deflate. */
async function unzip(buffer){
  const u=new Uint8Array(buffer), dv=new DataView(buffer); let eocd=-1;
  for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--)if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw Error('不是有效的 XLSX/ZIP 文件');
  const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true), files=new Map(); let p=cdOff;
  for(let n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50)throw Error('XLSX directory 损坏');
    const method=dv.getUint16(p+10,true), size=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.slice(p+46,p+46+nl));
    if(dv.getUint32(lo,true)!==0x04034b50)throw Error('XLSX entry 损坏');
    const lnl=dv.getUint16(lo+26,true), lxl=dv.getUint16(lo+28,true), start=lo+30+lnl+lxl, raw=u.slice(start,start+size);
    files.set(name,{method,raw}); p+=46+nl+xl+cl;
  }
  return {async text(name){const f=files.get(name);if(!f)return null;let bytes=f.raw;if(f.method===8){const ds=new DecompressionStream('deflate-raw');bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer())}else if(f.method!==0)throw Error('不支持的 ZIP compression');return new TextDecoder().decode(bytes)},has:n=>files.has(n)};
}
function xml(t){return new DOMParser().parseFromString(t,'application/xml')}
function attr(n,k){return n?.getAttribute(k)}
function colNum(ref){let n=0;for(const c of (ref.match(/[A-Z]+/i)?.[0]||''))n=n*26+c.toUpperCase().charCodeAt(0)-64;return n}
function colLetters(n){let s='';while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}
function serialDate(v){const d=new Date(Date.UTC(1899,11,30)+Number(v)*86400000);return Number.isNaN(d.getTime())?null:d}
function resolve(base,target){if(target.startsWith('/'))return target.slice(1);const a=base.split('/');a.pop();for(const x of target.split('/')){if(x==='..')a.pop();else if(x!=='.')a.push(x)}return a.join('/')}
async function readBook(buffer){
  const z=await unzip(buffer), wb=xml(await z.text('xl/workbook.xml')), rel=xml(await z.text('xl/_rels/workbook.xml.rels'));
  const rels=new Map([...rel.getElementsByTagName('Relationship')].map(x=>[attr(x,'Id'),attr(x,'Target')]));
  const sharedText=await z.text('xl/sharedStrings.xml'), shared=sharedText?[...xml(sharedText).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const styleText=await z.text('xl/styles.xml');let fills=[];if(styleText){const sx=xml(styleText), fs=[...sx.getElementsByTagName('fills')[0]?.children||[]], xfs=[...sx.getElementsByTagName('cellXfs')[0]?.children||[]];fills=xfs.map(x=>{const id=Number(attr(x,'fillId')||0), f=fs[id], fg=f?.getElementsByTagName('fgColor')[0];return (attr(fg,'rgb')||attr(fg,'indexed')||attr(fg,'theme')||'').toUpperCase()})}
  const sheets=[];
  for(const s of [...wb.getElementsByTagName('sheet')]){
    const target=rels.get(attr(s,'r:id')), path=resolve('xl/workbook.xml',target), doc=xml(await z.text(path)), cells=new Map(), formulas=new Map();let maxRow=0,maxCol=0;
    for(const c of [...doc.getElementsByTagName('c')]){const ref=attr(c,'r'), row=Number(ref.match(/\d+/)?.[0]), col=colNum(ref), type=attr(c,'t'), si=Number(attr(c,'s')||0), vn=c.getElementsByTagName('v')[0]?.textContent, fn=c.getElementsByTagName('f')[0]?.textContent;let val=vn;
      if(type==='s')val=shared[Number(vn)]??'';else if(type==='inlineStr')val=[...c.getElementsByTagName('t')].map(t=>t.textContent).join('');else if(type==='str')val=vn??'';else if(vn!==undefined&&vn!==null&&vn!=='')val=Number(vn);
      cells.set(`${row},${col}`,{v:val,fill:fills[si]||'',ref,formula:fn||null});if(fn)formulas.set(ref,fn);maxRow=Math.max(maxRow,row);maxCol=Math.max(maxCol,col)
    }
    sheets.push({name:attr(s,'name'),cells,formulas,maxRow,maxCol,path});
  }
  return {sheets};
}
function cell(sh,r,c){return sh.cells.get(`${r},${c}`)||{v:null,fill:'',ref:`${colLetters(c)}${r}`,formula:null}}
function text(sh,r,c){return String(cell(sh,r,c).v??'').trim()}
function norm(v){return String(v??'').trim().toUpperCase().replace(/\s+/g,'')}
function yellow(c){return /(?:FF)?FFFF00$/.test(c.fill)}
function isOff(code){return ['0','0-','0.0','0,0-','OT2'].includes(norm(code))}
function isWorkSlot(code){const c=norm(code);return c!==''&&!isOff(c)}
function displayDate(d){return d?`${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]} ${d.getUTCDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]}`:'?'}
function monthKey(d){return d?`${d.getUTCFullYear()}-${d.getUTCMonth()}`:''}
function findHeaders(sh){const hs=[];for(let r=1;r<=sh.maxRow;r++)if(norm(text(sh,r,1))==='ID'&&norm(text(sh,r,2))==='NAME'&&norm(text(sh,r,3))==='TEAM')hs.push(r);return hs}
function analyzeColumns(sh,row){const day=[];let totalClocked=null,total=null,absence=null,remarks=null;for(let c=1;c<=sh.maxCol;c++){const v=cell(sh,row,c).v,h=norm(v);if(v instanceof Number){}if(typeof v==='number'&&serialDate(v)?.getUTCFullYear()>2000)day.push(c);if(h.includes('TOTALCLOCKED'))totalClocked=c;if(h==='TOTAL')total=c;if(h.includes('ABSENCE'))absence=c;if(h.startsWith('REMARK'))remarks=c}return{day,totalClocked,total,absence,remarks}}
function groupWeeks(sh,header,cols){const out=[];for(const c of cols){const d=serialDate(cell(sh,header,c).v);if(!d)continue;let w=out[out.length-1];if(!w||d.getUTCDay()===1){w={cols:[],dates:[]};out.push(w)}w.cols.push(c);w.dates.push(d)}return out}
function findRows(sh,start,end){const rows=[];for(let r=start;r<end;r++){const id=cell(sh,r,1).v;if(typeof id==='number'&&text(sh,r,2))rows.push(r)}return rows}
function expectedA(code,y,r){const c=norm(code), work12=['2','8X-RAY','8X-XRAY','8-GS','8GS','X-OJT','CRP','COP','GS','PREM'];if(['0','0-','0.0'].includes(c))return{v:0,kind:'off'};if(work12.includes(c))return{v:y?r.aYellow:r.aWork,kind:'work'};if(c==='2200')return{v:r.a2200==null||r.a2200Yellow==null?null:(y?r.a2200Yellow:r.a2200),kind:r.a2200==null||r.a2200Yellow==null?'review':'work'};if(['CCU','PWM'].includes(c))return{v:8,kind:'work'};if(['MC','AL','ML','HPL','CCL','UL/AL'].includes(c))return{v:0,absence:11,kind:'absence'};if(c==='NS')return{v:0,absence:r.aNS,kind:'absence'};if(['UP/MC','UPMC','NPL','UL/NPL','ABSENT'].includes(c))return{v:0,absence:0,kind:'absence'};if(c==='OT2')return{v:null,kind:'review'};return{v:null,kind:c?'unknown':'blank'}}
function expectedB(code,y,meta,col,r){const c=norm(code), work12=['2','PREM','COP','CRP','8X-RAY','8X-XRAY','X-OJT','8GS','8-GS','GS'];if(['0','0-','0.0'].includes(c))return{v:0,kind:'off'};if(c==='OT2'){const first=meta.firstOff===col;return{v:first?(y?r.firstOT2Yellow:r.firstOT2):(y?r.otherOT2Yellow:r.otherOT2),kind:'ot2'}}if(['MC','AL','ML','HPL','CCL','UL/AL','CCU','UP/MC','UPMC','NPL','UL/NPL','ABSENT','NS','PWM'].includes(c))return{v:0,kind:'absence'};let hrs=null;if(work12.includes(c))hrs=y?r.bYellow:r.bWork;if(c==='2200'){if(r.b2200==null||r.b2200Yellow==null)return{v:null,kind:'review'};hrs=y?r.b2200Yellow:r.b2200}if(hrs!==null){if(!['5W2O','4W3O'].includes(meta.type))return{v:null,kind:'review'};return{v:Math.max(0,round1(hrs-meta.baseline)),kind:'work'}}return{v:null,kind:c?'unknown':'blank'}}
function numberOrText(v){return typeof v==='number'?v:(v==null?null:String(v).trim())}
function matches(exp,actual){if(exp==null)return null;if(typeof actual==='string')return exp===0;return typeof actual==='number'&&Math.abs(exp-actual)<.001}
function nameKey(v){return String(v||'').replace(/\s*\([^)]*\)\s*$/,'').replace(/\s+/g,' ').trim().toUpperCase()}

function buildReport(book){
  const sh=book.sheets[0], hs=findHeaders(sh);if(hs.length<2)throw Error('找不到上下两个 ID / NAME / TEAM header');const [rh,oh]=hs;let marker=oh-1;for(let r=rh+1;r<oh;r++)if(text(sh,r,2).toUpperCase().includes('OT TRACKING'))marker=r;
  const rc=analyzeColumns(sh,rh), oc=analyzeColumns(sh,oh), weeks=groupWeeks(sh,rh,rc.day), rosterRows=findRows(sh,rh+1,marker), otRows=findRows(sh,oh+1,sh.maxRow+1), otById=new Map(otRows.map(r=>[String(cell(sh,r,1).v),r])),otByName=new Map(),usedOt=new Set();for(const r of otRows){const k=nameKey(text(sh,r,2));if(!otByName.has(k))otByName.set(k,[]);otByName.get(k).push(r)}
  const months=new Map();for(const w of weeks)for(const d of w.dates)months.set(monthKey(d),(months.get(monthKey(d))||0)+1);const reportMonth=[...months].sort((a,b)=>b[1]-a[1])[0]?.[0];
  const officers=[], mismatches=[], identity=[], formulaIssues=[];

$('#file').onchange=e=>handleFile(e.target.files[0]);const drop=$('#drop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>handleFile(e.dataTransfer.files[0]));$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('.panel').forEach(p=>p.classList.toggle('active',p.id===t.dataset.tab))});
</script>
