<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roster OT 对比分析器</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --panel-alt: #f1f5f9;
      --ink: #0f172a;
      --ink-secondary: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --line-subtle: #edf2f7;
      --navy: #0f172a;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --blue-light: #eff6ff;
      --cyan: #0284c7;
      --amber: #b45309;
      --amber-bg: #fef3c7;
      --amber-border: #fde68a;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --red-border: #fecaca;
      --green: #15803d;
      --green-bg: #dcfce7;
      --green-border: #bbf7d0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 40px -10px rgba(15, 23, 42, 0.12);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: light; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, select { font: inherit; outline: none; }
    button { cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

    .shell {
      max-width: 1560px;
      margin: 0 auto;
      padding: 32px 28px 96px;
    }

    /* Topbar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.04em;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .brand h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.03em;
    }
    .brand p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }
    .privacy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green);
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: 999px;
      padding: 8px 16px;
      box-shadow: var(--shadow-sm);
    }
    .privacy-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    /* Upload Hero Section (大幅加大 & 豪华视觉美化) */
    .upload-hero {
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 60%, #093356 100%);
      border-radius: 24px;
      padding: 36px 40px;
      color: #fff;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .upload-hero::before {
      content: "";
      position: absolute;
      top: -30%;
      right: -10%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.22) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(50px);
    }
    .upload-hero-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .upload-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }
    .upload-title h2 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      color: #f8fafc;
    }
    .upload-title p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 680px;
      line-height: 1.6;
    }
    .upload-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      backdrop-filter: blur(8px);
    }

    /* 加大的大尺寸拖拽上传框 */
    .drop {
      border: 2px dashed rgba(255, 255, 255, 0.28);
      border-radius: 20px;
      padding: 52px 36px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
    }
    .drop:hover, .drop.drag {
      border-color: #60a5fa;
      background: rgba(37, 99, 235, 0.12);
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
    }
    .drop.drag {
      border-style: solid;
      background: rgba(37, 99, 235, 0.22);
    }
    .drop-icon-wrap {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      display: grid;
      place-items: center;
      margin-bottom: 2px;
      color: #93c5fd;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s ease;
    }
    .drop:hover .drop-icon-wrap {
      background: var(--blue);
      color: #fff;
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
    }
    .drop strong {
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .drop span {
      font-size: 13.5px;
      color: #94a3b8;
      max-width: 500px;
      line-height: 1.5;
    }
    .drop .drop-btn-fake {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      margin-top: 4px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      transition: all 0.2s ease;
    }
    .drop:hover .drop-btn-fake {
      background: #ffffff;
      color: var(--ink);
      border-color: #ffffff;
    }
    .drop input { display: none; }

    /* Sheet Picker Panel */
    .sheet-picker {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sheet-picker .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .sheet-picker label {
      font-weight: 700;
      color: var(--ink);
      font-size: 14px;
    }
    .sheet-picker select {
      min-width: 320px;
      max-width: 100%;
    }
    .footnote {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.5;
    }

    /* Status Bar */
    .status {
      min-height: 28px;
      font-size: 14px;
      margin: 12px 4px 20px;
      color: var(--muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status.error {
      color: var(--red);
      font-weight: 600;
      background: var(--red-bg);
      border: 1px solid var(--red-border);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
    }

    /* KPI Summary */
    .summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: var(--shadow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .metric:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }
    .metric::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #94a3b8;
      opacity: 0.7;
    }
    .metric .n {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--ink);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .metric .l {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric.bad {
      border-color: var(--red-border);
      background: #fffcfc;
    }
    .metric.bad::before { background: var(--red); opacity: 1; }
    .metric.bad .n { color: var(--red); }
    .metric.warn {
      border-color: var(--amber-border);
      background: #fffdf7;
    }
    .metric.warn::before { background: var(--amber); opacity: 1; }
    .metric.warn .n { color: var(--amber); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-top: 8px;
      margin-bottom: 20px;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 12px 20px;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      border-radius: 8px 8px 0 0;
    }
    .tab:hover {
      color: var(--ink);
      background: rgba(0, 0, 0, 0.02);
    }
    .tab.active {
      color: var(--blue);
      border-color: var(--blue);
    }

    /* Panels & Cards */
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }
    .card:hover {
      border-color: #cbd5e1;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line-subtle);
      background: #fafcff;
    }
    .card-head h2, .card-head h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .card-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .card-body {
      padding: 20px 24px;
    }

    /* Toolbars, Buttons & Inputs */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink-secondary);
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .btn:hover {
      border-color: #cbd5e1;
      background: var(--panel-alt);
      color: var(--ink);
    }
    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn.primary:hover {
      background: var(--blue-hover);
      border-color: var(--blue-hover);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .search {
      min-width: 260px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      background: #ffffff;
      color: var(--ink);
      font-size: 13px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .select {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      background: #ffffff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }
    .select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }
    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: #475569;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      z-index: 1;
      letter-spacing: 0.02em;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line-subtle);
      vertical-align: middle;
      color: var(--ink-secondary);
    }
    tr:last-child td {
      border-bottom: 0;
    }
    tr:hover td {
      background: #f8fbff;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
    }

    /* Badges & Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      line-height: 1.3;
    }
    .pill.a { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .pill.b { background: #e0f2fe; color: var(--cyan); border: 1px solid #bae6fd; }
    .pill.bad { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .pill.ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .pill.neutral { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .yellow {
      background: #fef08a !important;
      color: #854d0e !important;
      font-weight: 700 !important;
      border-radius: 4px;
      padding: 2px 4px;
    }

    /* Callouts */
    .callout {
      border-left: 4px solid var(--blue);
      background: #eff6ff;
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-bottom: 16px;
      font-size: 13.5px;
      color: #1e3a8a;
      line-height: 1.5;
    }
    .callout.warn {
      border-color: var(--amber);
      background: var(--amber-bg);
      color: #78350f;
    }
    .callout.bad {
      border-color: var(--red);
      background: var(--red-bg);
      color: #7f1d1d;
    }

    /* Officer Profile & Roster Grid */
    .officer-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      border-bottom: 1px solid var(--line-subtle);
      padding-bottom: 18px;
      margin-bottom: 18px;
    }
    .officer-head h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .officer-meta {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      margin-top: 4px;
    }
    .officer-stats {
      display: flex;
      gap: 28px;
      text-align: right;
    }
    .officer-stats div {
      background: var(--panel-alt);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--line-subtle);
    }
    .officer-stats b {
      display: block;
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .officer-stats span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }
    .person-link {
      border: 0;
      background: none;
      color: var(--blue);
      padding: 0;
      font: inherit;
      font-weight: 700;
      text-align: left;
    }
    .person-link:hover { text-decoration: underline; color: var(--blue-hover); }

    /* Matrix Roster Grid */
    .roster-scroll {
      overflow-x: auto;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }
    table.roster-grid {
      width: 100% !important;
      min-width: 0 !important;
      table-layout: fixed !important;
      font: 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    }
    table.roster-grid th, table.roster-grid td {
      position: static;
      text-align: center;
      min-width: 0 !important;
      padding: 8px 3px !important;
      border-right: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
    }
    table.roster-grid .rowhead {
      position: sticky !important;
      left: 0;
      z-index: 2;
      width: 64px !important;
      min-width: 64px !important;
      background: #f1f5f9 !important;
      color: #334155;
      font-weight: 800;
    }
    .week-end { border-right: 2px solid #64748b !important; }
    .prev-month { opacity: 0.45; }
    .offcell { background: #f1f5f9; color: #94a3b8; }
    .mismatch-cell {
      background: #fecaca !important;
      color: #b91c1c !important;
      font-weight: 800 !important;
      position: relative;
    }
    .legend {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      margin-top: 14px;
      padding: 10px 14px;
      background: #fafcff;
      border-radius: 8px;
      border: 1px solid var(--line-subtle);
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .swatch.yellow { background: #fef08a; border: 1px solid #eab308; }
    .swatch.offcell { background: #e2e8f0; border: 1px solid #cbd5e1; }
    .swatch.mismatch-cell { background: #fca5a5; border: 1px solid #f87171; }

    /* Rules Grid */
    .rules {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .rule {
      border: 1px solid var(--line);
      background: #fafcff;
      border-radius: 12px;
      padding: 14px 16px;
    }
    .rule label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-secondary);
    }
    .rule input {
      width: 80px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      background: #ffffff;
      font-weight: 700;
      text-align: right;
    }
    .rule input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    .formula {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      color: #1e293b;
    }
    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    @media (max-width: 1200px) {
      .summary { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .shell { padding: 18px 16px 64px; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }

function openOfficer(id){const o=state.report.officers.find(x=>x.id===String(id));if(!o)return;$$('nav.tabs > .tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='exceptions'));$$('.panel').forEach(p=>p.classList.toggle('active',p.id==='exceptions'));$('#personSearch').value=o.id;drawPerson(o);window.scrollTo({top:$('#officer').offsetTop-20,behavior:'smooth'})}

function issueTable(items){if(!items.length)return'<div class="empty">没有发现逐日差异</div>';return`<table><thead><tr><th>ID</th><th>Officer</th><th>Team</th><th>Scheme</th><th>星期</th><th>日期</th><th>Code</th><th>周类型</th><th>Expected</th><th>Actual</th><th>Cell</th></tr></thead><tbody>${items.map(d=>`<tr><td class="mono">${esc(d.o.id)}</td><td><button class="person-link" data-id="${esc(d.o.id)}">${esc(d.o.name)}</button></td><td>${esc(d.o.team)}</td><td><span class="pill ${d.o.scheme.toLowerCase()}">${d.o.scheme}</span></td><td>${esc(displayDate(d.week.start))}–${esc(displayDate(d.week.end))}</td><td>${esc(displayDate(d.date))}</td><td class="mono ${d.y?'yellow':''}">${esc(d.code)}</td><td><span class="pill neutral">${esc(d.week.type)}</span></td><td class="mono">${esc(d.expected)}</td><td class="mono bad">${esc(d.actual)}</td><td class="mono">${colLetters(d.col)}${d.o.rr} → ${colLetters(d.col)}${d.o.or}</td></tr>`).join('')}</tbody></table>`}
function filtersHtml(target){const teams=[...new Set(state.report.officers.map(o=>o.team))].sort();return`<div class="toolbar"><select class="select" data-filter-team="${target}"><option value="">全部 Team</option>${teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select><select class="select" data-filter-type="${target}"><option value="">全部周类型</option><option>5W2O</option><option>4W3O</option><option>6W1O</option><option>Partial week</option></select></div>`}
function renderWeeks(){const r=state.report, rows=[];for(const o of r.officers)for(let i=0;i<o.weeks.length;i++){const w=o.weeks[i];rows.push({o,w,i})}$('#weeks').innerHTML=`<div class="card"><div class="card-head"><div><h2>Scheme B Calendar Week 分类</h2><p>工作日包括 AL／MC 等原定工作slot；0、0-和OT2属于off slot。OT2不会把原定off改成W。</p></div></div><div class="card-body">${filtersHtml('week')}</div><div class="table-wrap" id="weekTable"></div></div>`;drawWeekRows(rows);$$('[data-filter-team="week"],[data-filter-type="week"]').forEach(x=>x.onchange=()=>drawWeekRows(rows))}
function drawWeekRows(rows){const team=$('[data-filter-team="week"]')?.value||'',type=$('[data-filter-type="week"]')?.value||'',f=rows.filter(x=>x.o.scheme==='B'&&(!team||x.o.team===team)&&(!type||x.w.type===type));$('#weekTable').innerHTML=f.length?`<table><thead><tr><th>Officer</th><th>Team</th><th>周</th><th>实际日期范围</th><th>W</th><th>O</th><th>分类</th><th>Daily baseline</th><th>第一个 off</th></tr></thead><tbody>${f.map(x=>`<tr><td>${esc(x.o.name)}</td><td>${esc(x.o.team)}</td><td>W${x.i+1}</td><td>${esc(displayDate(x.w.start))}–${esc(displayDate(x.w.end))}</td><td>${x.w.works}</td><td>${x.w.offs}</td><td><span class="pill ${x.w.type==='5W2O'||x.w.type==='4W3O'?'ok':'bad'}">${esc(x.w.type)}</span></td><td class="mono">${x.w.baseline??'—'}</td><td class="mono">${x.w.firstOff?colLetters(x.w.firstOff):'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有符合筛选条件的人员周</div>'}
function renderCompare(){const r=state.report,teams=['B1','B2','B3','B4','B5','B6'];state.diffTeam=state.diffTeam||'B1';$('#compare').innerHTML=`<div class="card"><div class="card-head"><div><h2>Hour mismatches</h2><p>按B1–B6查看上下表 expected 与 actual 不一致的格子</p></div><div class="toolbar"><button class="btn" id="csv">导出 CSV</button></div></div><div class="card-body"><div class="toolbar" id="teamButtons">${teams.map(t=>`<button class="btn ${state.diffTeam===t?'primary':''}" data-team="${t}">${t} (${r.mismatches.filter(d=>d.o.team===t).length})</button>`).join('')}</div><div style="margin-top:10px;"><select class="select" data-filter-type="diff"><option value="">全部周类型</option><option>5W2O</option><option>4W3O</option><option>6W1O</option><option>Partial week</option></select></div></div><div class="table-wrap" id="diffTable"></div></div>`;drawDiff();$$('#teamButtons [data-team]').forEach(x=>x.onclick=()=>{state.diffTeam=x.dataset.team;renderCompare()});$('[data-filter-type="diff"]').onchange=drawDiff;$('#csv').onclick=exportCsv}
function drawDiff(){const type=$('[data-filter-type="diff"]')?.value||'',f=state.report.mismatches.filter(d=>d.o.team===state.diffTeam&&(!type||d.week.type===type));$('#diffTable').innerHTML=issueTable(f);bindPersonLinks()}
function renderOfficer(){const r=state.report;$('#officer').innerHTML=`<div class="card"><div class="card-head"><div><h2>Look up one officer</h2><p>输入ID或姓名，或在异常表点击ID／姓名</p></div><div class="toolbar"><button class="btn" id="prevPerson">上一位</button><input id="personSearch" class="search" list="personList" placeholder="输入 ID 或姓名"><datalist id="personList">${r.officers.map(o=>`<option value="${esc(o.id)}">${esc(o.name)} · ${esc(o.team)}</option><option value="${esc(o.name)}">ID ${esc(o.id)} · ${esc(o.team)}</option>`).join('')}</datalist><button class="btn primary" id="findPerson">查询</button><button class="btn" id="nextPerson">下一位</button></div></div><div id="personView" class="card-body"><div class="empty">请输入 officer ID 或姓名</div></div></div>`;let current=-1;const show=i=>{current=(i+r.officers.length)%r.officers.length;const o=r.officers[current];$('#personSearch').value=o.id;drawPerson(o)},find=()=>{const q=$('#personSearch').value.trim().toUpperCase(),hits=r.officers.filter(o=>o.id.toUpperCase()===q||o.name.toUpperCase()===q);let o=hits.length===1?hits[0]:r.officers.find(o=>o.name.toUpperCase().includes(q));if(o){current=r.officers.indexOf(o);drawPerson(o)}else $('#personView').innerHTML='<div class="empty">找不到唯一匹配的ID或姓名，请输入ID</div>'};$('#findPerson').onclick=find;$('#prevPerson').onclick=()=>show(current<0?0:current-1);$('#nextPerson').onclick=()=>show(current<0?0:current+1);$('#personSearch').onkeydown=e=>{if(e.key==='Enter')find()}}
function drawPerson(o){
  if(!o)return;
  const r=state.report,remark=r.oc.remarks&&o.or?text(r.sh,o.or,r.oc.remarks):'',end=d=>d.date.getUTCDay()===0?'week-end':'',old=d=>monthKey(d.date)!==r.reportMonth?'prev-month':'',mism=o.days.filter(d=>d.match===false).length;
  let html=`<div class="officer-head"><div><h3>${esc(o.name)} <span class="pill ${o.scheme.toLowerCase()}">Scheme ${o.scheme}</span></h3><div class="officer-meta">ID ${esc(o.id)} · ${esc(o.team)} · ${esc(o.appointment||'—')}</div></div><div class="officer-stats"><div><b>${mism}</b><span>Mismatches</span></div><div><b>${esc(o.actualOT??'—')}</b><span>Total OT (hrs)</span></div><div><b>${esc(o.actualAbsence??'—')}</b><span>Absence hrs (exp. ${esc(o.expectedAbsence)})</span></div></div></div>${remark?`<div class="callout warn"><b>Remark:</b> ${esc(remark)}</div>`:''}`;
  if(!o.or){$('#personView').innerHTML=html+'<div class="callout bad">OT TRACKING没有唯一匹配记录，无法画出HOURS行。</div>';return}
  const days=o.days;
  html+=`<div class="roster-scroll"><table class="roster-grid"><tbody><tr><th class="rowhead">DATE</th>${days.map(d=>`<td class="${end(d)} ${old(d)}"><small>${['SUN','MON','TUE','WED','THU','FRI','SAT'][d.date.getUTCDay()]}</small><br><b>${d.date.getUTCDate()}</b><br><small>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.date.getUTCMonth()]}</small></td>`).join('')}</tr><tr><th class="rowhead">ROSTER</th>${days.map(d=>`<td class="${end(d)} ${old(d)} ${isOff(d.code)?'offcell':''} ${d.y?'yellow':''}">${esc(d.code||'—')}</td>`).join('')}</tr><tr><th class="rowhead">HOURS</th>${days.map(d=>`<td title="${d.expected==null?'Expected unresolved':'Expected '+esc(d.expected)}" class="${end(d)} ${old(d)} ${d.match===false?'mismatch-cell':''}">${esc(d.actual??'—')}</td>`).join('')}</tr></tbody></table></div><div class="legend"><span><i class="swatch yellow"></i>黄色 = stand-down 单元格</span><span><i class="swatch offcell"></i>灰色 = 休息日 (Off)</span><span><i class="swatch mismatch-cell"></i>红色 = 实际 ≠ 预期 (悬停查看详情)</span><span>半透明 = 上月跨期日期</span><span>深色竖线 = 星期日 (周周期截止)</span></div>`;
  $('#personView').innerHTML=html;
}
function renderCap(){const a=state.report.caps;$('#cap').innerHTML=`<div class="card"><div class="card-head"><div><h2>72-hour OT cap breaches</h2><p>Scheme A读取下表TOTAL；Scheme B合计报告月份内的每日Actual OT</p></div></div><div class="table-wrap">${a.length?`<table><thead><tr><th>ID</th><th>Name</th><th>Team</th><th>Scheme</th><th>Actual OT</th><th>超过上限</th></tr></thead><tbody>${a.map(o=>`<tr><td class="mono">${esc(o.id)}</td><td>${esc(o.name)}</td><td>${esc(o.team)}</td><td><span class="pill ${o.scheme.toLowerCase()}">${o.scheme}</span></td><td class="mono bad">${o.actualOT}</td><td class="mono">+${round1(o.actualOT-72)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有发现超过72小时的officer</div>'}</div></div>`}
function renderIdentity(){const a=state.report.identity;$('#identity').innerHTML=`<div class="card"><div class="card-head"><div><h2>ID / Name / Team / Duty-tag mismatches</h2><p>ID是第一匹配键；ID找不到时才使用标准化姓名定位并标记ID mismatch</p></div></div><div class="table-wrap">${a.length?`<table><thead><tr><th>ID</th><th>Name</th><th>类型</th><th>上表</th><th>OT TRACKING</th><th>Rows</th></tr></thead><tbody>${a.map(x=>`<tr><td class="mono">${esc(x.o.id)}</td><td>${esc(x.o.name)}</td><td><span class="pill bad">${esc(x.type)}</span></td><td>${esc(x.top??'—')}</td><td>${esc(x.bottom??'—')}</td><td class="mono">${esc(x.o.rr)} → ${esc(x.o.or??'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">ID、Name、Team和Duty tag全部一致</div>'}</div></div>`}
function renderPattern(){const a=state.report.patterns;$('#pattern').innerHTML=`<div class="card"><div class="card-head"><div><h2>Roster-pattern deviations within a team</h2><p>逐日比较同Team的基础排班1／2／0／0-；个人leave、training与OT2不参与多数模式</p></div></div><div class="card-body">${filtersHtml('pattern')}</div><div class="table-wrap" id="patternTable"></div></div>`;const draw=()=>{const team=$('[data-filter-team="pattern"]').value,f=a.filter(x=>!team||x.o.team===team);$('#patternTable').innerHTML=f.length?`<table><thead><tr><th>ID</th><th>Name</th><th>Team</th><th>Date</th><th>Officer pattern</th><th>Team majority</th><th>Distribution</th><th>Review</th><th>Cell</th></tr></thead><tbody>${f.map(x=>`<tr><td class="mono">${esc(x.o.id)}</td><td>${esc(x.o.name)}</td><td>${esc(x.o.team)}</td><td>${esc(displayDate(x.date))}</td><td><span class="pill bad">${esc(x.own)}</span></td><td>${esc(x.consensus)}</td><td class="mono">${esc(Object.entries(x.counts).map(([k,v])=>`${k}=${v}`).join(', '))}</td><td>${esc(x.severity)}</td><td class="mono">${colLetters(x.col)}${x.o.rr}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有符合筛选条件的Team pattern deviation</div>'};draw();$('[data-filter-team="pattern"]').onchange=draw;$('[data-filter-type="pattern"]').remove()}
function renderFormula(){const r=state.report, key=r.formulaCells.filter(x=>/AJ|AK|AL|AM|AN|AO|AP/.test(x.ref)).slice(0,120);$('#formula').innerHTML=`<div class="card"><div class="card-head"><div><h2>Workbook formula 检查</h2><p>公式用于理解旧表口径，但 expected 仍按规则设置计算</p></div></div><div class="card-body"><div class="callout warn"><b>需要注意：</b> Scheme A 月度总工时与周OT使用不同日期边界是合理的；月度范围只含报告月，周OT必须保留完整 Mon–Sun。月底若缺少 Thu–Sun，不能凭空推算。</div>${r.formulaIssues.map(x=>`<div class="callout bad">${esc(x)}</div>`).join('')}<div class="table-wrap"><table><thead><tr><th>Cell</th><th>Formula</th></tr></thead><tbody>${key.map(x=>`<tr><td class="mono">${esc(x.ref)}</td><td><div class="formula">=${esc(x.f)}</div></td></tr>`).join('')}</tbody></table></div></div></div>`}
function renderRules(){const R=state.rules, fields=[['aWork','Scheme A：2 / GS 等'],['aYellow','Scheme A：黄色'],['a2200','Scheme A：2200（未确认）'],['a2200Yellow','Scheme A：2200 黄色（未确认）'],['aNS','Scheme A：NS absence'],['bWork','Scheme B：2 / GS 等'],['bYellow','Scheme B：黄色'],['b2200','Scheme B：2200（未确认）'],['b2200Yellow','Scheme B：2200 黄色（未确认）'],['firstOT2','OT2：第一个 off'],['firstOT2Yellow','OT2：第一个 off 黄色'],['otherOT2','OT2：其他 off'],['otherOT2Yellow','OT2：其他 off 黄色']];$('#rules').innerHTML=`<div class="card"><div class="card-head"><div><h2>规则设置</h2><p>空白表示规则未确认，不会静默计为0。代码1和6也保留为待确认。</p></div><button class="btn primary" id="rerun">重新分析</button></div><div class="card-body"><div class="rules">${fields.map(([k,l])=>`<div class="rule"><label>${esc(l)}<input type="number" step="0.1" data-rule="${k}" value="${R[k]??''}"></label></div>`).join('')}</div></div></div>`;$('#rerun').onclick=()=>{$$('[data-rule]').forEach(x=>state.rules[x.dataset.rule]=x.value.trim()===''?null:Number(x.value));state.report=buildReport(state.book);render();setStatus('已使用更新后的规则重新分析。')}}
function exportCsv(){const rows=[['Category','ID','Name','Team','Scheme','Date / field','Expected / top','Actual / bottom','Reference']];for(const d of state.report.mismatches)rows.push(['Hour mismatch',d.o.id,d.o.name,d.o.team,d.o.scheme,displayDate(d.date),d.expected,d.actual,`${colLetters(d.col)}${d.o.rr} → ${colLetters(d.col)}${d.o.or}`]);for(const o of state.report.caps)rows.push(['72-hour cap',o.id,o.name,o.team,o.scheme,'Total OT','72',o.actualOT,'']);for(const x of state.report.identity)rows.push(['Identity',x.o.id,x.o.name,x.o.team,x.o.scheme||'',x.type,x.top,x.bottom,`${x.o.rr} → ${x.o.or??'—'}`]);for(const x of state.report.patterns)rows.push(['Potential roster deviation',x.o.id,x.o.name,x.o.team,x.o.scheme,displayDate(x.date),x.consensus,x.own,`${colLetters(x.col)}${x.o.rr}`]);const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='roster-ot-comparison.csv';a.click();URL.revokeObjectURL(a.href)}
async function handleFile(f){if(!f)return;$('#fileName').textContent=f.name;$('#results').style.display='none';$('#sheetPicker').style.display='none';setStatus('正在读取 workbook 的 tab 名称…');try{state.buffer=await f.arrayBuffer();state.book=await readBook(state.buffer);state.report=null;state.sheetIndex=null;$('#sheetSelect').innerHTML=state.book.sheets.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('');$('#sheetPicker').style.display='block';setStatus(`已读取 ${state.book.sheets.length} 个 tab。请选择一个 tab 后点击“分析此 Tab”；其他 tab 不会被读取或分析。`)}catch(e){console.error(e);setStatus(e.message||String(e),true)}}
async function analyzeSelected(){if(!state.book)return;const index=Number($('#sheetSelect').value),name=state.book.sheets[index]?.name||'';setStatus(`正在读取并分析 tab：${name}…`);$('#analyzeSheet').disabled=true;try{state.sheetIndex=index;await loadSheet(state.book,index);state.report=buildReport(state.book,index);render();setStatus(`完成：${name} · ${state.report.officers.length} 名 officer，${state.report.mismatches.length} 个逐日差异。`)}catch(e){console.error(e);$('#results').style.display='none';setStatus(`${name}：${e.message||String(e)}`,true)}finally{$('#analyzeSheet').disabled=false}}
$('#analyzeSheet').onclick=analyzeSelected;$('#file').onchange=e=>handleFile(e.target.files[0]);const drop=$('#drop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>handleFile(e.dataTransfer.files[0]));$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('.panel').forEach(p=>p.classList.toggle('active',p.id===t.dataset.tab))});
</script>
